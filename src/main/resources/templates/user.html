<!DOCTYPE html>
<html lang="ru" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid px-4">
        <span class="navbar-brand text-white">
            <strong id="navbar-email">Загрузка...</strong>
            <span class="text-secondary ms-2" id="navbar-roles"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-link text-white-50 text-decoration-none p-0">Logout</button>
        </form>
    </div>
</nav>

<div class="container-fluid mt-3">
    <div class="row">
        <div class="col-md-2 px-0 bg-white" style="min-height: calc(100vh - 70px);">
            <div class="nav flex-column nav-pills mt-2">
                <a class="nav-link active rounded-0 py-2 px-4 w-100" href="/user">User</a>
            </div>
        </div>
        <div class="col-md-10 px-4">
            <h1 class="mb-3 fw-medium text-dark">User information-page</h1>
            <div class="card mt-4">
                <div class="card-header bg-light border-bottom py-2">
                    <h5 class="mb-0 fw-normal">About user</h5>
                </div>
                <div class="card-body p-4">
                    <table class="table table-striped table-hover align-middle border-top">
                        <thead>
                        <tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Role</th></tr>
                        </thead>
                        <tbody id="user-info-table-body">
                        <tr><td colspan="6" class="text-center text-secondary">Загрузка данных профиля...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ✅ ПРАВИЛЬНОЕ подключение Bootstrap JS и user.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/user.js}"></script>
</body>
</html>
