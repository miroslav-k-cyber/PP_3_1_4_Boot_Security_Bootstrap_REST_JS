<!DOCTYPE html>
<html lang="ru" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Навбар -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid px-4">
        <span class="navbar-brand text-white">
            <strong id="navbar-email">Загрузка...</strong>
            <span class="text-secondary ms-2" id="navbar-roles"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-link text-white-50 text-decoration-none p-0">Logout</button>
        </form>
    </div>
</nav>

<div class="container-fluid mt-3">
    <div class="row">
        <!-- Левое меню -->
        <div class="col-md-2 px-0 bg-white">
            <div class="nav flex-column nav-pills mt-2">
                <a class="nav-link active rounded-0 py-2 px-4 w-100" href="/admin">Admin</a>
                <a class="nav-link rounded-0 py-2 px-4 w-100" href="/user">User</a>
            </div>
        </div>

        <!-- Контент -->
        <div class="col-md-10 px-4">
            <h1 class="mb-3 fw-medium text-dark">Admin panel</h1>

            <!-- Вкладки -->
            <ul class="nav nav-tabs mt-3" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="nav-users-table-tab" data-bs-toggle="tab"
                            data-bs-target="#nav-users-table" type="button" role="tab">Users table</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="nav-new-user-tab" data-bs-toggle="tab" data-bs-target="#nav-new-user"
                            type="button" role="tab">New User</button>
                </li>
            </ul>

            <div class="tab-content mt-3">
                <!-- Таблица -->
                <div class="tab-pane fade show active" id="nav-users-table" role="tabpanel">
                    <div class="card">
                        <div class="card-header bg-light border-bottom py-2"><h5 class="mb-0">All users</h5></div>
                        <div class="card-body p-4">
                            <table class="table table-striped table-hover align-middle border-top">
                                <thead>
                                <tr>
                                    <th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Role</th><th>Edit</th><th>Delete</th>
                                </tr>
                                </thead>
                                <tbody id="usersTableBody">
                                <tr><td colspan="8" class="text-center text-muted">Загрузка...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Форма нового пользователя -->
                <div class="tab-pane fade" id="nav-new-user" role="tabpanel">
                    <div class="card">
                        <div class="card-header bg-light border-bottom py-2"><h5 class="mb-0">Add new user</h5></div>
                        <div class="card-body d-flex justify-content-center py-4">
                            <form id="newUserForm" class="col-md-4 text-center">
                                <div class="mb-3"><label class="form-label">First name</label><input type="text" id="newFirstName" class="form-control" required></div>
                                <div class="mb-3"><label class="form-label">Last name</label><input type="text" id="newLastName" class="form-control" required></div>
                                <div class="mb-3"><label class="form-label">Age</label><input type="number" id="newAge" class="form-control" required></div>
                                <div class="mb-3"><label class="form-label">Email</label><input type="email" id="newEmail" class="form-control" required></div>
                                <div class="mb-3"><label class="form-label">Password</label><input type="password" id="newPassword" class="form-control" required></div>
                                <div class="mb-3">
                                    <label class="form-label">Role</label>
                                    <select id="newRoles" multiple size="2" class="form-select" required></select>
                                </div>
                                <button type="submit" class="btn btn-success btn-lg px-4">Add new user</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модалка Edit -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Edit user</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="editUserForm">
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-3"><label>First name</label><input type="text" id="editFirstName" class="form-control" required></div>
                    <div class="mb-3"><label>Last name</label><input type="text" id="editLastName" class="form-control" required></div>
                    <div class="mb-3"><label>Age</label><input type="number" id="editAge" class="form-control" required></div>
                    <div class="mb-3"><label>Email</label><input type="email" id="editEmail" class="form-control" required></div>
                    <div class="mb-3"><label>Password</label><input type="password" id="editPassword" class="form-control"></div>
                    <div class="mb-3">
                        <label>Role</label>
                        <select id="editRoles" class="form-select" multiple size="2"></select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Модалка Delete -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Delete user</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="deleteUserForm">
                <div class="modal-body text-center">
                    <input type="hidden" id="deleteId">
                    <p>Are you sure you want to delete <strong id="deleteFirstName"></strong>?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
