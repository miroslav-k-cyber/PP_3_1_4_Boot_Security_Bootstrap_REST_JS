<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid px-4">
        <span class="navbar-brand text-white">
            <strong id="navbar-email">Загрузка...</strong>
            <span class="text-secondary ms-2" id="navbar-roles"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-link text-white-50 text-decoration-none p-0">Logout</button>
        </form>
    </div>
</nav>

<div class="container-fluid mt-3">
    <div class="row">
        <div class="col-md-2 px-0 bg-white">
            <div class="nav flex-column nav-pills">
                <a class="nav-link active rounded-0 py-2 px-4 w-100" href="/admin">Admin</a>
                <a class="nav-link rounded-0 py-2 px-4 w-100" href="/user">User</a>
            </div>
        </div>
        <div class="col-md-10 px-4">
            <h1 class="mb-3 fw-medium text-dark">Admin panel</h1>

            <ul class="nav nav-tabs mt-3">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#users-table" type="button">
                        Users table
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#new-user" type="button">New User
                    </button>
                </li>
            </ul>

            <div class="tab-content mt-3">
                <!-- Таблица -->
                <div class="tab-pane fade show active" id="users-table">
                    <div class="card">
                        <div class="card-header bg-light border-bottom py-2"><h5 class="mb-0">All users</h5></div>
                        <div class="card-body p-4">
                            <table class="table table-striped table-hover align-middle border-top">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                                </thead>
                                <tbody id="all-users-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Форма New User -->
                <div class="tab-pane fade" id="new-user">
                    <div class="card">
                        <div class="card-header bg-light border-bottom py-2"><h5 class="mb-0">Add new user</h5></div>
                        <div class="card-body d-flex justify-content-center py-4">
                            <form id="createForm" class="col-md-4 text-center">
                                <div class="mb-3"><label>First name</label><input type="text" id="create-name"
                                                                                  class="form-control" required></div>
                                <div class="mb-3"><label>Last name</label><input type="text" id="create-lastName"
                                                                                 class="form-control" required></div>
                                <div class="mb-3"><label>Age</label><input type="number" id="create-age"
                                                                           class="form-control" required></div>
                                <div class="mb-3"><label>Email</label><input type="email" id="create-email"
                                                                             class="form-control" required></div>
                                <div class="mb-3"><label>Password</label><input type="password" id="create-password"
                                                                                class="form-control" required></div>
                                <div class="mb-3">
                                    <label>Role</label>
                                    <select id="create-roles" class="form-select" multiple size="2" required>
                                        <option th:each="role : ${allRoles}" th:value="${role.id}"
                                                th:text="${role.name.replace('ROLE_', '')}"></option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-success btn-lg px-4">Add new user</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модалка Edit -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editModalForm">
                <div class="modal-body">
                    <input type="hidden" id="edit-id">
                    <div class="mb-3"><label>First name</label><input type="text" id="edit-name" class="form-control"
                                                                      required></div>
                    <div class="mb-3"><label>Last name</label><input type="text" id="edit-lastName" class="form-control"
                                                                     required></div>
                    <div class="mb-3"><label>Age</label><input type="number" id="edit-age" class="form-control"
                                                               required></div>
                    <div class="mb-3"><label>Email</label><input type="email" id="edit-email" class="form-control"
                                                                 required></div>
                    <div class="mb-3"><label>Password</label><input type="password" id="edit-password"
                                                                    class="form-control"></div>
                    <div class="mb-3">
                        <label>Role</label>
                        <select id="edit-roles" class="form-select" multiple size="2">
                            <option th:each="role : ${allRoles}" th:value="${role.id}"
                                    th:text="${role.name.replace('ROLE_', '')}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Модалка Delete -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="deleteModalForm">
                <div class="modal-body">
                    <input type="hidden" id="delete-id">
                    <div class="mb-3"><label>ID</label><input type="text" id="delete-id-display" class="form-control"
                                                              disabled></div>
                    <div class="mb-3"><label>First name</label><input type="text" id="delete-name" class="form-control"
                                                                      disabled></div>
                    <div class="mb-3"><label>Last name</label><input type="text" id="delete-lastName"
                                                                     class="form-control" disabled></div>
                    <div class="mb-3"><label>Age</label><input type="number" id="delete-age" class="form-control"
                                                               disabled></div>
                    <div class="mb-3"><label>Email</label><input type="email" id="delete-email" class="form-control"
                                                                 disabled></div>
                    <div class="mb-3">
                        <label>Role</label>
                        <select id="delete-roles" class="form-select" multiple size="2" disabled>
                            <option th:each="role : ${allRoles}" th:value="${role.id}"
                                    th:text="${role.name.replace('ROLE_', '')}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/admin.js}"></script>
</body>
</html>
